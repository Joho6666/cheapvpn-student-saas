name: CheapVPN CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cheapvpn-cf-dry-run"

      - name: Run regression suite
        run: npm run test:all
